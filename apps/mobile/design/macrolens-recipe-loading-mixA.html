<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MacroLens — Recipe loading (Mix A · grand carré)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#16181C; --muted:#6B7280; --muted2:#9AA0AA;
    --accent:#149E6E; --accentInk:#0C6B4C; --accentWash:#E6F4EE; --accentLine:#CDE8DC;
    --protein:#C75A45; --carbs:#D6A24A; --fat:#5C7CC2;
    --bg:#F6F7F7; --surface:#FFFFFF; --line:#E8EAED;
    --display:'Space Grotesk',sans-serif; --mono:'IBM Plex Mono',monospace;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0d0f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:34px;font-family:var(--display)}
  .phone{width:332px;height:712px;background:var(--bg);border-radius:46px;border:10px solid #0a0a0a;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden;position:relative;display:flex;flex-direction:column}
  .head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 4px}
  .back{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:17px}
  .eyebrow{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
  .chip{background:var(--accentWash);border:1px solid var(--accentLine);border-radius:7px;padding:3px 9px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.4px;color:var(--accentInk)}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 28px}
  .title{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.4px;color:var(--ink);text-align:center;transition:opacity .3s}
  .caption{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center;min-height:17px;transition:opacity .26s}

  .heroA{position:relative;width:268px;height:188px;transition:height .6s var(--ease)}
  .heroA.reveal{height:400px}
  .heroA.pop{animation:heropop .3s ease}
  @keyframes heropop{0%{transform:scale(1)}42%{transform:scale(1.05)}100%{transform:scale(1)}}
  .heroA .rng{position:absolute;left:42px;top:0;transform:rotate(-90deg);transition:opacity .4s;z-index:1}
  .heroA.reveal .rng{opacity:0}
  .heroA .pbg{fill:none;stroke:var(--line);stroke-width:7}
  .heroA .pfg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
  .heroA .ph{position:absolute;left:69px;top:27px;width:130px;height:130px;border-radius:999px;object-fit:cover;z-index:2;transition:all .6s var(--ease)}
  .heroA .scr{position:absolute;left:69px;top:27px;width:130px;height:130px;border-radius:999px;background:rgba(8,8,8,.16);z-index:3;transition:all .6s var(--ease)}
  .heroA.reveal .ph{left:10px;top:0;width:248px;height:248px;border-radius:26px}
  .heroA.reveal .scr{left:10px;top:0;width:248px;height:248px;border-radius:26px;background:linear-gradient(to top,rgba(8,8,8,.34),transparent 64%)}
  .heroA .badge{position:absolute;left:50%;top:144px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 15px;font-family:var(--mono);font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:4;transition:opacity .3s}
  .heroA .badge small{opacity:.6;font-size:11px;margin-left:1px}
  .heroA.reveal .badge{opacity:0}
  .heroA .rev{position:absolute;left:0;top:268px;width:268px;opacity:0;transform:translateY(14px);transition:opacity .5s .2s,transform .5s .2s;z-index:2}
  .heroA.reveal .rev{opacity:1;transform:translateY(0)}

  .kcalbig{font-family:var(--mono);font-weight:600;font-size:50px;letter-spacing:-2px;color:var(--ink);line-height:1;display:flex;align-items:flex-end;gap:6px;justify-content:center}
  .kcalbig small{font-family:var(--mono);font-size:15px;color:var(--muted);font-weight:500;margin-bottom:7px}
  .macros3{display:flex;gap:10px;width:100%;margin-top:16px}
  .mcell{flex:1}
  .mhead{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .mdot{width:8px;height:8px;border-radius:2px}
  .mname{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .mval{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink)}
  .mtrack{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
  .mfill{height:100%;border-radius:999px;width:0%}
  .spark{position:absolute;font-size:22px;opacity:0;transition:.3s;pointer-events:none}
  .seebtn{margin-top:16px;align-self:center;padding:11px 22px;border-radius:999px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--display);font-weight:700;font-size:14px;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;box-shadow:0 8px 22px rgba(20,158,110,.35)}
  .seebtn.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
  <div class="phone">
    <div class="head"><div class="back">‹</div><div class="eyebrow">MacroLens</div><div style="width:36px"></div></div>
    <div class="stage">
      <div class="chip" style="margin-bottom:16px">TikTok</div>
      <div class="heroA" id="heroA">
        <svg class="rng" width="184" height="184"><circle class="pbg" cx="92" cy="92" r="82"/><circle id="ring" class="pfg" cx="92" cy="92" r="82"/></svg>
        <img class="ph" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80&auto=format&fit=crop" alt="dish"/>
        <div class="scr"></div>
        <div class="badge"><span id="pct">0</span><small>%</small></div>
        <div class="rev">
          <div style="position:relative;display:flex;justify-content:center">
            <div class="spark" id="spark" style="top:-12px;right:40px">✨</div>
            <div class="kcalbig"><span id="kcal">0</span><small>kcal</small></div>
          </div>
          <div class="macros3">
            <div class="mcell"><div class="mhead"><span class="mdot" style="background:var(--protein)"></span><span class="mname">Protein</span></div><div class="mval"><span id="mp">0</span>g</div><div class="mtrack"><div class="mfill" id="fp" style="background:var(--protein)"></div></div></div>
            <div class="mcell"><div class="mhead"><span class="mdot" style="background:var(--carbs)"></span><span class="mname">Carbs</span></div><div class="mval"><span id="mc">0</span>g</div><div class="mtrack"><div class="mfill" id="fc" style="background:var(--carbs)"></div></div></div>
            <div class="mcell"><div class="mhead"><span class="mdot" style="background:var(--fat)"></span><span class="mname">Fat</span></div><div class="mval"><span id="mf">0</span>g</div><div class="mtrack"><div class="mfill" id="ff" style="background:var(--fat)"></div></div></div>
          </div>
        </div>
      </div>
      <div class="title" id="title" style="margin-top:10px">Cooking up your recipe</div>
      <div class="caption" id="cap">Reading the post 🔍</div>
      <div class="seebtn" id="seebtn"><span>See the recipe</span><span style="font-size:17px">→</span></div>
    </div>
  </div>

<script>
  const easeOut = (x) => 1 - Math.pow(1 - Math.min(Math.max(x,0),1), 3);
  const C = 2 * Math.PI * 82;
  const TARGET = { kcal:512, p:52, c:56, f:6 };
  const FILL = { p:72, c:78, f:30 };
  const caps = ['Reading the post 🔍','Spotting ingredients 🥢','Estimating portions ⚖️'];
  const $ = (id) => document.getElementById(id);
  $('ring').style.strokeDasharray = C;

  const P = 8200, T1 = 3400, REVEAL = 2400;
  let t0 = null;
  function tick(ts){
    if (t0===null) t0=ts;
    const t=(ts-t0)%P;
    const reveal = t>=T1;
    // climbs fast to ~84% then keeps creeping toward ~95% (never reaches 100 until ready)
    const a1 = t<2000 ? easeOut(t/2000)*0.84 : 0.84 + Math.min((t-2000)/11000,1)*0.11;

    $('pct').textContent = Math.round((reveal?1:a1)*100);
    $('ring').style.strokeDashoffset = C*(1-(reveal?1:a1));
    if(!reveal){ const idx=Math.min(2,Math.floor(t/1100)); if($('cap').dataset.k!==String(idx)){$('cap').dataset.k=String(idx);$('cap').textContent=caps[idx];} }

    $('heroA').classList.toggle('reveal', reveal);
    $('heroA').classList.toggle('pop', reveal && t < T1 + 320);
    $('seebtn').classList.toggle('show', reveal);
    $('title').textContent = reveal ? 'Crunching your macros 🔥' : 'Cooking up your recipe';

    if(reveal){
      const r = easeOut((t-T1)/REVEAL);
      $('kcal').textContent = Math.round(r*TARGET.kcal);
      $('mp').textContent = Math.round(r*TARGET.p);
      $('mc').textContent = Math.round(r*TARGET.c);
      $('mf').textContent = Math.round(r*TARGET.f);
      $('fp').style.width = (r*FILL.p)+'%';
      $('fc').style.width = (r*FILL.c)+'%';
      $('ff').style.width = (r*FILL.f)+'%';
      $('spark').style.opacity = r>=0.98 ? 1 : 0;
      $('spark').style.transform = r>=0.98 ? 'scale(1.25) rotate(10deg)' : 'scale(.6)';
      $('cap').textContent = 'Locking in your macros ✨';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
