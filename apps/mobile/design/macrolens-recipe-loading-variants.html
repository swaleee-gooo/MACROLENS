<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MacroLens — Recipe loading styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#16181C; --ink2:#3A3E46; --muted:#6B7280; --muted2:#9AA0AA;
    --accent:#149E6E; --accentInk:#0C6B4C; --accentWash:#E6F4EE; --accentLine:#CDE8DC;
    --protein:#C75A45; --carbs:#D6A24A; --fat:#5C7CC2;
    --bg:#F6F7F7; --surface:#FFFFFF; --line:#E8EAED; --line2:#DEE1E6;
    --display:'Space Grotesk',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0d0f;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;gap:30px;flex-wrap:wrap;padding:34px;font-family:var(--display)}
  .col{display:flex;flex-direction:column;align-items:center;gap:14px}
  .tag{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.6px;color:#cfd2d6;text-transform:uppercase}
  .tag b{color:#fff}
  .phone{width:312px;height:660px;background:var(--bg);border-radius:42px;border:9px solid #0a0a0a;box-shadow:0 24px 64px rgba(0,0,0,.5);overflow:hidden;position:relative;display:flex;flex-direction:column}
  .head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px}
  .back{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:16px}
  .eyebrow{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
  .chip{background:var(--accentWash);border:1px solid var(--accentLine);border-radius:7px;padding:3px 9px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.4px;color:var(--accentInk)}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 24px}
  .title{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.4px;color:var(--ink);text-align:center}
  .caption{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center;min-height:17px;transition:opacity .26s}

  /* ===== Variant 1 : Pulse ring % ===== */
  .ringhero{position:relative;width:184px;height:184px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .ringhero svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .ringhero .pbg{fill:none;stroke:var(--line);stroke-width:7}
  .ringhero .pfg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
  .ringhero .photo{width:130px;height:130px;border-radius:999px;object-fit:cover}
  .ringhero .scrim{position:absolute;width:130px;height:130px;border-radius:999px;background:rgba(8,8,8,.18)}
  .pctbadge{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font-family:var(--mono);font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .pctbadge small{opacity:.6;font-size:11px;margin-left:1px}
  .mini-dots{display:flex;gap:7px;margin-top:18px}
  .mini-dots span{width:8px;height:8px;border-radius:999px}

  /* ===== Variant 2 : Building bars ===== */
  .photocard{width:100%;height:118px;border-radius:16px;overflow:hidden;position:relative;margin-bottom:16px}
  .photocard img{width:100%;height:100%;object-fit:cover}
  .photocard .lab{position:absolute;left:12px;bottom:10px;color:#fff;font-family:var(--display);font-weight:700;font-size:16px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .photocard .pulse{position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);background-size:220% 100%;animation:shine 1.8s linear infinite}
  @keyframes shine{to{background-position:-220% 0}}
  .blist{width:100%;display:flex;flex-direction:column;gap:13px}
  .brow .btop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .brow .blabel{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:7px}
  .brow .bcheck{width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;background:var(--accent);opacity:0;transform:scale(.4);transition:.25s}
  .brow.done .bcheck{opacity:1;transform:scale(1)}
  .brow .bpct{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}
  .brow.done .bpct{color:var(--accentInk)}
  .btrack{height:7px;border-radius:999px;background:var(--line);overflow:hidden}
  .bfill{height:100%;border-radius:999px;width:0%}

  /* ===== Variant 3 : Macro score reveal ===== */
  .photoreveal{width:100%;height:104px;border-radius:16px;overflow:hidden;position:relative;margin-bottom:14px}
  .photoreveal img{width:100%;height:100%;object-fit:cover}
  .photoreveal .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,8,.45),transparent 60%)}
  .kcalbig{font-family:var(--mono);font-weight:600;font-size:52px;letter-spacing:-2px;color:var(--ink);line-height:1;display:flex;align-items:flex-end;gap:6px}
  .kcalbig small{font-family:var(--mono);font-size:15px;color:var(--muted);font-weight:500;margin-bottom:8px}
  .spark{position:absolute;font-size:20px;opacity:0;transition:.3s}
  .macros3{display:flex;gap:10px;width:100%;margin-top:18px}
  .mcell{flex:1}
  .mcell .mhead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .mcell .mdot{width:8px;height:8px;border-radius:2px}
  .mcell .mname{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .mcell .mval{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink)}
  .mcell .mtrack{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
  .mcell .mfill{height:100%;border-radius:999px;width:0%}
</style>
</head>
<body>

  <!-- VARIANT 1 -->
  <div class="col">
    <div class="tag">Style 1 — <b>Ring % qui monte</b></div>
    <div class="phone">
      <div class="head"><div class="back">‹</div><div class="eyebrow">MacroLens</div><div style="width:34px"></div></div>
      <div class="stage">
        <div class="chip" style="margin-bottom:18px">TikTok</div>
        <div class="ringhero">
          <svg width="184" height="184"><circle class="pbg" cx="92" cy="92" r="82"/><circle id="v1ring" class="pfg" cx="92" cy="92" r="82"/></svg>
          <img class="photo" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80&auto=format&fit=crop" alt="dish"/>
          <div class="scrim"></div>
          <div class="pctbadge"><span id="v1pct">0</span><small>%</small></div>
        </div>
        <div class="mini-dots"><span style="background:var(--protein)"></span><span style="background:var(--carbs)"></span><span style="background:var(--fat)"></span></div>
        <div class="title" style="margin-top:22px">Cooking up your recipe</div>
        <div class="caption" id="v1cap">Reading the post 🔍</div>
      </div>
    </div>
  </div>

  <!-- VARIANT 2 -->
  <div class="col">
    <div class="tag">Style 2 — <b>Barres qui se remplissent</b></div>
    <div class="phone">
      <div class="head"><div class="back">‹</div><div class="eyebrow">MacroLens</div><div style="width:34px"></div></div>
      <div class="stage" style="justify-content:flex-start;padding-top:26px">
        <div class="chip" style="align-self:center;margin-bottom:16px">TikTok</div>
        <div class="photocard">
          <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80&auto=format&fit=crop" alt="dish"/>
          <div class="pulse"></div>
          <div class="lab">Building your recipe…</div>
        </div>
        <div class="blist" id="v2list"></div>
      </div>
    </div>
  </div>

  <!-- VARIANT 3 -->
  <div class="col">
    <div class="tag">Style 3 — <b>Macros qui défilent 🔥</b></div>
    <div class="phone">
      <div class="head"><div class="back">‹</div><div class="eyebrow">MacroLens</div><div style="width:34px"></div></div>
      <div class="stage" style="justify-content:flex-start;padding-top:26px">
        <div class="chip" style="align-self:center;margin-bottom:16px">TikTok</div>
        <div class="photoreveal">
          <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80&auto=format&fit=crop" alt="dish"/>
          <div class="scrim"></div>
        </div>
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;margin-top:8px">
          <div class="spark" id="v3spark" style="top:-14px;right:24px">✨</div>
          <div class="kcalbig"><span id="v3kcal">0</span><small>kcal</small></div>
        </div>
        <div class="macros3">
          <div class="mcell"><div class="mhead"><span class="mdot" style="background:var(--protein)"></span><span class="mname">Protein</span></div><div class="mval"><span id="v3p">0</span>g</div><div class="mtrack"><div class="mfill" id="v3pf" style="background:var(--protein)"></div></div></div>
          <div class="mcell"><div class="mhead"><span class="mdot" style="background:var(--carbs)"></span><span class="mname">Carbs</span></div><div class="mval"><span id="v3c">0</span>g</div><div class="mtrack"><div class="mfill" id="v3cf" style="background:var(--carbs)"></div></div></div>
          <div class="mcell"><div class="mhead"><span class="mdot" style="background:var(--fat)"></span><span class="mname">Fat</span></div><div class="mval"><span id="v3f">0</span>g</div><div class="mtrack"><div class="mfill" id="v3ff" style="background:var(--fat)"></div></div></div>
        </div>
        <div class="title" style="margin-top:22px">Crunching your macros 🔥</div>
        <div class="caption" id="v3cap">Almost there…</div>
      </div>
    </div>
  </div>

<script>
  const easeOut = (x) => 1 - Math.pow(1 - Math.min(Math.max(x,0),1), 3);
  const clamp01 = (x) => Math.min(Math.max(x,0),1);

  // ---- Variant 1 ----
  const C = 2 * Math.PI * 82;
  const v1ring = document.getElementById('v1ring');
  v1ring.style.strokeDasharray = C;
  const v1pct = document.getElementById('v1pct');
  const v1cap = document.getElementById('v1cap');
  const v1caps = ['Reading the post 🔍','Spotting ingredients 🥢','Estimating portions ⚖️','Crunching macros 🧮'];

  // ---- Variant 2 ----
  const v2steps = [
    { label:'Reading the post', color:'var(--accent)', start:0,    dur:1100 },
    { label:'Spotting ingredients', color:'var(--protein)', start:900,  dur:1100 },
    { label:'Estimating portions', color:'var(--carbs)', start:1800, dur:1100 },
    { label:'Crunching the macros', color:'var(--fat)', start:2700, dur:1300 },
  ];
  const v2list = document.getElementById('v2list');
  v2list.innerHTML = v2steps.map((s,i)=>`
    <div class="brow" id="v2row${i}">
      <div class="btop">
        <span class="blabel"><span class="bcheck">✓</span>${s.label}</span>
        <span class="bpct" id="v2pct${i}">0%</span>
      </div>
      <div class="btrack"><div class="bfill" id="v2fill${i}" style="background:${s.color}"></div></div>
    </div>`).join('');

  // ---- Variant 3 ----
  const v3kcal=document.getElementById('v3kcal'), v3p=document.getElementById('v3p'),
        v3c=document.getElementById('v3c'), v3f=document.getElementById('v3f'),
        v3pf=document.getElementById('v3pf'), v3cf=document.getElementById('v3cf'),
        v3ff=document.getElementById('v3ff'), v3spark=document.getElementById('v3spark');
  const TARGET={kcal:512,p:52,c:56,f:6};

  const P=5200, t0={v:null};
  function tick(ts){
    if(t0.v===null)t0.v=ts;
    const t=(ts-t0.v)%P;

    // V1
    const p1=easeOut(t/4000);
    const pct1=Math.round(p1*100);
    v1pct.textContent=pct1;
    v1ring.style.strokeDashoffset=C*(1-p1);
    const ci=Math.min(3,Math.floor(t/1000));
    if(v1cap.textContent!==v1caps[ci]) v1cap.textContent=v1caps[ci];

    // V2
    v2steps.forEach((s,i)=>{
      const p=clamp01((t-s.start)/s.dur);
      document.getElementById('v2fill'+i).style.width=(p*100)+'%';
      document.getElementById('v2pct'+i).textContent=Math.round(p*100)+'%';
      document.getElementById('v2row'+i).classList.toggle('done', p>=1);
    });

    // V3
    const p3=easeOut(t/3500);
    v3kcal.textContent=Math.round(p3*TARGET.kcal);
    v3p.textContent=Math.round(p3*TARGET.p);
    v3c.textContent=Math.round(p3*TARGET.c);
    v3f.textContent=Math.round(p3*TARGET.f);
    v3pf.style.width=(p3*72)+'%'; v3cf.style.width=(p3*78)+'%'; v3ff.style.width=(p3*30)+'%';
    v3spark.style.opacity = p3>=0.99 ? 1 : 0;
    v3spark.style.transform = p3>=0.99 ? 'scale(1.2) rotate(8deg)' : 'scale(.6)';

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
